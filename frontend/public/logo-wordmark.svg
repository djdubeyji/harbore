<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%">
  <defs>
    <!-- Shared Shield/Icon Gradients -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="55%" stop-color="#0072FF"/>
      <stop offset="100%" stop-color="#002B7A"/>
    </linearGradient>
    <linearGradient id="anchorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#38E1FF"/>
      <stop offset="100%" stop-color="#00A3FF"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#FF6D00"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D6EAFF"/>
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Master Icon Symbol (Shared exact geometry) -->
    <g id="harboreMark">
      <!-- Shield Outer Contour -->
      <path d="M 60 18 
               C 86 26, 100 26, 106 28 
               C 108 64, 96 96, 60 110 
               C 24 96, 12 64, 14 28 
               C 20 26, 34 26, 60 18 Z" 
            fill="none" 
            stroke="url(#shieldGrad)" 
            stroke-width="3.5" 
            stroke-linejoin="round"
            filter="url(#cyanGlow)"/>

      <!-- Inner Radar Scanner Arcs -->
      <path d="M 30 64 A 36 36 0 0 1 52 48" fill="none" stroke="#00E5FF" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
      <path d="M 68 48 A 36 36 0 0 1 90 64" fill="none" stroke="url(#amberGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>

      <!-- Anchor / Core Sentinel -->
      <circle cx="60" cy="38" r="8" fill="none" stroke="url(#anchorGrad)" stroke-width="3"/>
      <circle cx="60" cy="38" r="3" fill="#00E5FF"/>
      <path d="M 44 51 L 76 51" stroke="url(#anchorGrad)" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M 60 46 L 60 92" stroke="url(#anchorGrad)" stroke-width="4" stroke-linecap="round"/>
      <path d="M 34 72 C 36 90, 48 100, 60 100 C 72 100, 84 90, 86 72" fill="none" stroke="url(#anchorGrad)" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M 30 74 L 34 70 L 38 74" fill="none" stroke="url(#anchorGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 82 74 L 86 70 L 90 74" fill="none" stroke="url(#anchorGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </defs>

  <!-- Render Scaled Master Icon -->
  <g transform="translate(10, 5) scale(0.92)">
    <use href="#harboreMark"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(135, 0)">
    <text x="0" y="68" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" 
          font-size="52" 
          font-weight="800" 
          letter-spacing="-1.5" 
          fill="url(#textGrad)">harbor<tspan fill="#00E5FF">e</tspan></text>
    <circle cx="186" cy="34" r="3" fill="#FF9E00"/>
    <text x="2" y="90" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
          font-size="11" 
          font-weight="600" 
          letter-spacing="3.5" 
          fill="#4D7099">SECURE · MANAGE · COMPLY</text>
  </g>
</svg>
