version: '3.9'

services:

  # ─── Data layer ──────────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: harbore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       harbore
      POSTGRES_USER:     harbore
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harbore -d harbore"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: harbore-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --save 60 100
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── Core ────────────────────────────────────────────────────────────────────

  orchestrator:
    build:
      context: ./orchestrator
      dockerfile: Dockerfile
    image: harbore-orchestrator:latest
    container_name: harbore-orchestrator
    restart: unless-stopped
    environment:
      DATABASE_URL:           postgresql://harbore:${POSTGRES_PASSWORD}@postgres:5432/harbore?sslmode=disable
      REDIS_ADDR:             redis:6379
      REDIS_PASSWORD:         ${REDIS_PASSWORD}
      JWT_SECRET:             ${JWT_SECRET}
      WORKER_TOKEN:           ${WORKER_TOKEN}
      WORKER_IMAGE:           harbore-worker:latest
      DOCKER_NETWORK:         harbore_default
      REPORT_URL:             http://report:8091
      AI_URL:                 http://ai:8090
      AI_ENABLED:             ${AI_ENABLED:-false}
      ANTHROPIC_API_KEY:      ${ANTHROPIC_API_KEY:-}
      DEFAULT_MAX_CONTAINERS: ${DEFAULT_MAX_CONTAINERS:-10}
      DEFAULT_MAX_RETRIES:    ${DEFAULT_MAX_RETRIES:-3}
      PORT:                   "8080"
      ENV:                    ${ENV:-production}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker-builder:
    build:
      context: ./worker
      dockerfile: Dockerfile
    image: harbore-worker:latest
    container_name: harbore-worker-builder
    entrypoint: ["echo", "Worker image ready"]
   
  worker:
    image: harbore-worker:latest
    restart: unless-stopped
    environment:
      ORCHESTRATOR_URL:      http://orchestrator:8080
      WORKER_TOKEN:          ${WORKER_TOKEN}
      REDIS_ADDR:            redis:6379
      REDIS_PASSWORD:        ${REDIS_PASSWORD}
      NUCLEI_TEMPLATES_PATH: /nuclei-templates
    depends_on:
      redis:
        condition: service_healthy
      orchestrator:
        condition: service_healthy
      worker-builder:
        condition: service_completed_successfully

  ai:
    build:
      context: ./ai
      dockerfile: Dockerfile
    image: harbore-ai:latest
    container_name: harbore-ai
    restart: unless-stopped
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      WORKER_TOKEN:      ${WORKER_TOKEN}
      PORT:              "8090"
    expose:
      - "8090"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  report:
    build:
      context: ./report
      dockerfile: Dockerfile
    image: harbore-report:latest
    container_name: harbore-report
    restart: unless-stopped
    environment:
      WORKER_TOKEN: ${WORKER_TOKEN}
      PORT:         "8091"
    expose:
      - "8091"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8091/health')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: harbore-frontend:latest
    container_name: harbore-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      orchestrator:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: harbore_default
    driver: bridge
